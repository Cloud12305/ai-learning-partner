server.port=8080
spring.application.name=learn-buddy-backend

# MySQL ??
spring.datasource.url=jdbc:mysql://localhost:3306/learn_buddy_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# MongoDB ??
spring.data.mongodb.uri=mongodb://localhost:27017/learn_buddy_logs
spring.data.mongodb.database=learn_buddy_logs

# Redis ??
spring.data.redis.host=localhost
spring.data.redis.port=6379
# spring.data.redis.password=your_password # ???????

# H2 ????????????????
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ????
logging.level.com.digitalhorsepower.learnbuddy=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

# Swagger ??
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true